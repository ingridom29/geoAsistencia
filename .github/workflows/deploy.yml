name: Deploy a sgds.pe/asistencia

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        working-directory: mobile
        run: npm ci

      - name: Build (export web)
        working-directory: mobile
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_ADMIN_PANEL_URL: https://sgds.pe/empleados/
        run: npm run build

      - name: Deploy por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.prointeco.pe
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: mobile/dist/
          server-dir: /asistencia/
          security: strict
          # El export de Expo mete las fuentes bajo assets/node_modules/... (es solo el nombre de
          # la carpeta, no dependencias reales) — sin esto, la exclusión por defecto de node_modules
          # de esta acción se las come y las fuentes quedan en 404.
          exclude: |
            **/.git*
            **/.git*/**
